name=CanUniversal
version=2.0.0
author=Bruno Rivera (prune74)
maintainer=Bruno Rivera (prune74)
sentence=Universal CAN bus library for ESP32, with unified support for the internal TWAI controller (ACAN_ESP32) and one or more external MCP2515 (ACAN2515).
paragraph=Provides a single send/receive API for multiple simultaneous CAN buses, hardware configuration supplied by the application via the CanConfigProvider pattern, and typed messages (CanMsg, CanID with Locoduino 29-bit identifiers). Used in the Chemins de Fer du Chablais (CFC) DCC/model-railroad architecture.
