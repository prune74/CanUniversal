name=CanUniversal
version=3.1.0
author=Bruno Rivera
maintainer=Bruno Rivera
sentence=Universal CAN bus library for ESP32, no external dependency: built-in TWAI controller and external MCP2515 supported natively.
paragraph=Multi-bus CAN library with a generic backend interface. Each bus can use the ESP32 internal controller (TWAI) or an external MCP2515 over SPI, configured by an application-provided provider. Non-blocking send and receive, optional hardware acceptance filter, software loopback, 11-bit and 29-bit (Locoduino/Maerklin) identifiers. Works alongside DCC (no interrupt).
